name: release

# Every push to main is analysed by semantic-release (Conventional Commits). When the commits
# warrant a release it tags the commit, creates the GitHub Release and calls scripts/publish.sh,
# which pushes the multi-arch image and the Helm chart for that version to GHCR.
# Nothing is committed back to main: the chart keeps its 0.0.0 placeholders in the repository.
on:
  push:
    branches: [main]
  # Recovery: semantic-release creates the tag and the GitHub Release before it publishes the
  # artifacts. If publishing failed, a re-run of the push workflow finds nothing new to release,
  # so run this workflow manually with the version of that existing release instead.
  workflow_dispatch:
    inputs:
      version:
        description: 'Existing release version without v prefix, e.g. 1.2.3'
        required: true
        type: string

permissions:
  contents: read

# Releases must run one at a time and in order; a newer push waits instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push the tag and create the GitHub Release
      packages: write # push the image and the chart to GHCR
      issues: write # semantic-release comments on released issues
      pull-requests: write # ... and on released pull requests
    steps:
      - uses: actions/checkout@v7.0.1 # v7
        with:
          # semantic-release needs the full history and all tags to find the last release.
          fetch-depth: 0
          # The default checkout credentials stay on purpose: semantic-release verifies that it
          # can push and pushes the release tag over this git remote.
      - uses: actions/setup-node@v7.1.0 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Quality gate before anything is released. e2e (Playwright/Redis) runs on pull requests only.
      - name: Lint, typecheck and test
        run: npm run lint && npm run typecheck && npm test
      - uses: docker/setup-qemu-action@v4.4.0 # v4
      - uses: docker/setup-buildx-action@v4.4.1 # v4
      - uses: azure/setup-helm@v5.0.1 # v5
        with:
          version: v3.22.1
      - uses: docker/login-action@v4.6.0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Re-publishes image and chart of an already existing release tag (see workflow_dispatch above).
  # scripts/publish.sh builds inside Docker and only needs docker, helm and git, so no Node setup.
  # It never overwrites an artifact that already exists in GHCR.
  republish:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # push the image and the chart to GHCR
    steps:
      - uses: actions/checkout@v7.0.1 # v7
        with:
          # The checkout fails if the tag does not exist.
          ref: refs/tags/v${{ inputs.version }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0 # v4
      - uses: docker/setup-buildx-action@v4.4.1 # v4
      - uses: azure/setup-helm@v5.0.1 # v5
        with:
          version: v3.22.1
      - uses: docker/login-action@v4.6.0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish image and chart
        run: bash scripts/publish.sh "$VERSION"
        env:
          # Passed through the environment, never interpolated into the script; publish.sh
          # validates that it is a semantic version.
          VERSION: ${{ inputs.version }}
