name: release

# Every push to main is analysed by semantic-release (Conventional Commits). When the commits
# warrant a release it tags the commit, creates the GitHub Release and calls scripts/publish.sh,
# which pushes the multi-arch image and the Helm chart for that version to GHCR.
# Nothing is committed back to main: the chart keeps its 0.0.0 placeholders in the repository.
on:
  push:
    branches: [main]

permissions:
  contents: read

# Releases must run one at a time and in order; a newer push waits instead of cancelling.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write # push the tag and create the GitHub Release
      packages: write # push the image and the chart to GHCR
      issues: write # semantic-release comments on released issues
      pull-requests: write # ... and on released pull requests
    steps:
      - uses: actions/checkout@v7.0.1 # v7
        with:
          # semantic-release needs the full history and all tags to find the last release.
          fetch-depth: 0
          # The default checkout credentials stay on purpose: semantic-release verifies that it
          # can push and pushes the release tag over this git remote.
      - uses: actions/setup-node@v7.1.0 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Quality gate before anything is released. e2e (Playwright/Redis) runs on pull requests only.
      - name: Lint, typecheck and test
        run: npm run lint && npm run typecheck && npm test
      - uses: docker/setup-qemu-action@v4.4.0 # v4
      - uses: docker/setup-buildx-action@v4.4.1 # v4
      - uses: azure/setup-helm@v5.0.1 # v5
        with:
          version: v3.22.1
      - uses: docker/login-action@v4.6.0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
