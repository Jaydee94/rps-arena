name: ci

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pr-title:
    # Conventional Commits are enforced on the PR title (squash-merge title).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.1 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            docs
            ci
            chore
            test
            refactor
            build

  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v7.0.1 # v7
      - uses: actions/setup-node@v7.1.0 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1 # v7
      - uses: actions/setup-node@v7.1.0 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run e2e

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1 # v7
      - uses: docker/setup-buildx-action@v4.4.1 # v4
      - uses: docker/build-push-action@v7.4.0 # v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.8.0
    steps:
      - uses: actions/checkout@v7.0.1 # v7
      - uses: azure/setup-helm@v5.0.1 # v5
        with:
          version: v3.22.1
      - name: Install kubeconform
        run: |
          set -euo pipefail
          base="https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}"
          curl -fsSLO "${base}/kubeconform-linux-amd64.tar.gz"
          curl -fsSLO "${base}/CHECKSUMS"
          grep ' kubeconform-linux-amd64.tar.gz$' CHECKSUMS | sha256sum --check -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf kubeconform-linux-amd64.tar.gz -C "${RUNNER_TEMP}/bin" kubeconform
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          rm kubeconform-linux-amd64.tar.gz CHECKSUMS
      - run: bash scripts/helm-check.sh
